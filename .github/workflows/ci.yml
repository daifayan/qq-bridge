name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Installs deps and runs the postinstall @snowluma SDK patch (idempotent).
      - name: Install dependencies
        run: npm ci

      # Cross-platform syntax check for every tracked src/ and scripts/ JS/MJS file.
      - name: Syntax check
        run: npm run check:syntax

      # .bat/.cmd must stay pure ASCII; Windows cmd parses them byte-wise.
      - name: Launcher encoding audit
        run: npm run audit:launchers

      # Offline audit suite: fixtures and mocks only (QQ_BRIDGE_TEST_LIVE=0),
      # no live DSH / OneBot / QQ needed.
      - name: Audit suite
        run: npm run test:audit

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # High-confidence credential scan over tracked files only.
      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # Production dependencies only; fail on high or critical advisories.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
