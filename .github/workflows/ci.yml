name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: syntax + audit suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Installs deps and runs the postinstall @snowluma SDK patch (idempotent).
      - name: Install dependencies
        run: npm ci

      # Syntax-check every source file. `node --check` only parses, so it is
      # cheap and independent of the audit suite below.
      - name: Syntax check
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            if node --check "$f" 2>/dev/null; then
              :
            else
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          exit $fail

      # Offline audit suite: fixtures and mocks only (QQ_BRIDGE_TEST_LIVE=0),
      # no live DSH / OneBot / QQ needed. Runs the same 10 scripts as local.
      - name: Audit suite
        run: npm run test:audit
